[package]
name = "facegear-studio"
version = "0.1.0"
description = "面齿轮设计与分析一体化工作台"
authors = ["facegear"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "facegear_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
